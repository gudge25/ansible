---
- hosts: localhost
  gather_facts: false

  vars:
    pbx_hosts: "{{ groups['all_pbx_servers'] }}"

  tasks:

    - name: Build PBX pairs
      set_fact:
        pbx_pairs: "{{ pbx_pairs | default([]) + [{'src': item, 'dst': pair}] }}"
      vars:
        pair: "{{ item | regex_replace('^([^.]+)(.*)$', '\\g<1>2\\2') }}"
      loop: "{{ pbx_hosts }}"
      when:
        - item is not match('^[^.]+2\\.')
        - pair in pbx_hosts

    - name: Compare firewall lists
      loop: "{{ pbx_pairs }}"
      loop_control:
        label: "{{ item.src }} -> {{ item.dst }}"
      block:

        - name: Read source firewall list
          delegate_to: "{{ item.src }}"
          shell: |
            fwconsole firewall list trusted | grep -v entries | sort -u | xargs -n1
          register: src
          changed_when: false

        - name: Read destination firewall list
          delegate_to: "{{ item.dst }}"
          shell: |
            fwconsole firewall list trusted | grep -v entries | sort -u | xargs -n1
          register: dst
          changed_when: false

        - name: Show differences
          debug:
            msg:
              pair: "{{ item.src }} -> {{ item.dst }}"
              add: "{{ src.stdout_lines | difference(dst.stdout_lines) }}"
              remove: "{{ dst.stdout_lines | difference(src.stdout_lines) }}"
