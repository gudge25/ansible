---
- hosts: localhost
  gather_facts: false

  vars:
    pbx_hosts: "{{ groups['all_pbx_servers'] }}"

  tasks:
    - name: Build PBX pairs
      set_fact:
        pbx_pairs: "{{ pbx_pairs | default([]) + [{'src': item, 'dst': pair}] }}"
      vars:
        pair: "{{ item | regex_replace('^([^.]+)(.*)$', '\\g<1>2\\2') }}"
      loop: "{{ pbx_hosts }}"
      when:
        - item is not match('^[^.]+2\\.')
        - pair in pbx_hosts

    - debug:
        var: pbx_pairs

    - name: Get trusted firewall list from source
      delegate_to: "{{ item.src }}"
      shell: |
        fwconsole firewall list trusted | grep -v entries | sort -u | xargs
      register: firewall_lists
      loop: "{{ pbx_pairs }}"
      loop_control:
        label: "{{ item.src }}"    
